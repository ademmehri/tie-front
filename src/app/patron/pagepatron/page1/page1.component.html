<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<app-header></app-header>

<section>
  <div class="b">
    <div class="sb">
     <div class="titre">
      <h2>Cherchez <span>nos talents</span></h2>
     </div>
      <div class="navbar">
       <div class="relod" (click)="verfieracces()">
        <i class='bx bx-revision'></i>
       </div>
      
              <div class="re">
                <i class='bx bxs-user'></i>
                <select  class="select" (change)="onselectetat($event)">
                  <option value="">Candidat</option>
                  <option value="Employé(e)">Employé(e)</option>
                  <option value="Stagiaire">Stagiaire</option>
                </select>
              </div>
              <div class="ba" *ngIf="pack=='premium'"></div>
              <div class="re" *ngIf="pack=='premium'">
                <i class='bx bxs-user'></i>
                <select  (change)="onselectexp($event)" >
                  <option value="">Expérience</option>
                  <option value="0-6 mois">0-6 mois</option>
                  <option value="6 mois-1 ans">6 mois-1 ans</option>
                  <option value="1 ans-5 ans">1 ans-5 ans</option>
                  <option value="5 ans et plus">5 ans et plus</option>
                 </select>
              </div>
            
            <div class="ba"></div>
           
              <div class="re" *ngIf="empr">
                <i class='bx bxs-graduation'></i>
                <select  class="select" (change)="onselect($event)"  >
                  <option value="" >Spécilalité</option>
              <option  *ngFor="let t of distinctSpecialties" value="{{t}}">{{t}}</option>
                </select>
           
              </div>
         
          
           
             <div class="ba"></div>
            
              <div class="re">
                <i class='bx bx-map-pin'></i>
                <select  class="select" (change)="onselectreg($event)">
                  <option value="">Gouvernerat</option>
                  <option value="ariana">ariana</option>
                  <option value="ben aarous">ben aarous</option>
                  <option value="bizerte">bizerte</option>
                  <option value="Béja">Béja</option>
                  <option value="Gabès">Gabès</option>
                  <option value="Gafsa">Gafsa</option>
                  <option value="Jendouba">Jendouba</option>
                  <option value="Kairouan">Kairouan</option>
                  <option value="Kasserine">Kasserine</option>
                  <option value="Kébili">Kébili</option>
                  <option value="Le Kef">Le Kef</option>
                  <option value="Gafsa">Gafsa</option>
                  <option value="Mahdia">Mahdia</option>
                  <option value="La Manouba">La Manouba</option>
                  <option value="Médenine">Médenine</option>
                  <option value="Monastir">Monastir</option>
                  <option value="Nabeul">Nabeul</option>
                  <option value="Sfax">Sfax</option>
                  <option value="Sidi Bouzid">Sidi Bouzid</option>
                  <option value="Siliana">Siliana</option>
                  <option value="Sousse">Sousse</option>
                  <option value="Tozeur">Tozeur</option>
                  <option value="Tunis">Tunis</option>
                  <option value="Zaghouan">Zaghouan</option>
                </select>
              </div>
        
            <div class="ba" *ngIf="pack=='premium' || pack=='avancée' "></div>
          
              <div class="re" *ngIf="pack=='premium' || pack=='avancée' ">
                <i class='bx bx-group'></i>
                <select  class="select" (change)="onselectsexe($event)">
                  <option value="">Sexe</option>
                  <option value="Homme">Homme</option>
                  <option value="Femme">Femme</option>
                  <option value="tous">tous</option>
                
                </select>
              </div>
            
                <div class="bt" ><i class='bx bx-filter-alt'></i><a  (click)="rechercher()">Rechercher</a></div>
          </div>
    </div>
          
    </div>
      <div class="employee" > 
        <div *ngFor="let emp of employees  | paginate
        : { itemsPerPage: 12, currentPage: p, totalItems: totalItems }">
          <div class="card"  (click)="naviguer(emp.id)">
            <div class="ico">
            
                <div *ngIf=" this.emp.fls['image']==undefined">
                  <img src="assets\backpatron.png" alt="image">
                </div>     
                <div *ngIf=" this.emp.fls['image']!=undefined">
                  <img src="uploads\{{this.emp.fls['image']}}" alt="image">
                </div>   
              
            </div>
            <div class="info">
              <div class="d">
                <div class="d2">
                  <p class="sp">{{emp.nom}}</p>
                  <p class="nom">{{emp.gouvernerat}}</p>
                </div>
              </div>
              <p class="num sp">{{emp.num}}</p>
            </div>
          </div>
        </div>
        
      

      </div>
   <div class="pag">
    <pagination-controls
    class="custom-pagination-controls"
    (pageChange)="p = $event"
    [maxSize]="5"
    [directionLinks]="true"
    [autoHide]="false"
  ></pagination-controls>
   </div>
      <app-footer></app-footer>
</section>
